name: 'SecURL Security Posture Scan'
description: 'Passive external security posture analysis for public web targets — scores, grades, SARIF findings, and CI policy gates.'
author: 'SecURL'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  url:
    description: 'Target URL to scan (e.g. https://example.com). Required unless targets is set.'
    required: false

  targets:
    description: 'Space-separated list of URLs to scan in one run. Use instead of url for multi-target scans.'
    required: false

  scan-mode:
    description: 'Scan depth: default | quiet | deep-passive. quiet is recommended for high-frequency CI gates.'
    required: false
    default: 'quiet'

  fail-on:
    description: 'Fail the job when findings at this severity or above are present. Values: critical | warning | info'
    required: false
    default: ''

  fail-if-score-below:
    description: 'Fail the job when any target score drops below this value (0–100).'
    required: false
    default: ''

  fail-on-regression:
    description: 'Fail the job when a regression is detected against the baseline file.'
    required: false
    default: 'false'

  baseline:
    description: 'Path to a previously saved JSON report to compare against. Enables regression detection.'
    required: false
    default: ''

  upload-sarif:
    description: 'Upload SARIF results to GitHub Code Scanning (requires code-scanning write permission).'
    required: false
    default: 'true'

  post-pr-comment:
    description: 'Post a posture summary comment on the pull request (requires pull-requests write permission).'
    required: false
    default: 'true'

  format:
    description: 'Output format for the step summary: summary | markdown | json. Defaults to summary.'
    required: false
    default: 'summary'

  node-version:
    description: 'Node.js version to use. Must be 22 or higher.'
    required: false
    default: '22'

outputs:
  score:
    description: 'Posture score (0–100) for the primary target.'
    value: ${{ steps.scan.outputs.score }}

  grade:
    description: 'Posture grade (A–F) for the primary target.'
    value: ${{ steps.scan.outputs.grade }}

  critical-count:
    description: 'Number of critical findings.'
    value: ${{ steps.scan.outputs.critical_count }}

  warning-count:
    description: 'Number of warning findings.'
    value: ${{ steps.scan.outputs.warning_count }}

  passed:
    description: 'true if all CI policy gates passed, false if any failed.'
    value: ${{ steps.scan.outputs.passed }}

  report-path:
    description: 'Path to the full JSON report written by this action.'
    value: ${{ steps.scan.outputs.report_path }}

  sarif-path:
    description: 'Path to the SARIF file written by this action (if upload-sarif is true).'
    value: ${{ steps.scan.outputs.sarif_path }}

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Build scan command
      id: build-cmd
      shell: bash
      run: |
        TARGETS="${{ inputs.targets }}"
        URL="${{ inputs.url }}"

        if [ -z "$TARGETS" ] && [ -z "$URL" ]; then
          echo "::error::Either 'url' or 'targets' input must be provided."
          exit 1
        fi

        if [ -n "$TARGETS" ]; then
          SCAN_TARGETS="$TARGETS"
        else
          SCAN_TARGETS="$URL"
        fi

        CMD="npx --yes @ktbatterham/external-posture-core@latest scan $SCAN_TARGETS"

        # Scan mode
        MODE="${{ inputs.scan-mode }}"
        if [ "$MODE" = "quiet" ]; then
          CMD="$CMD --quiet"
        elif [ "$MODE" = "deep-passive" ]; then
          CMD="$CMD --deep-passive"
        fi

        # Output format
        CMD="$CMD --format ci-json"
        CMD="$CMD --output ${{ runner.temp }}/securl-report.json"

        # CI policy flags
        FAIL_ON="${{ inputs.fail-on }}"
        if [ -n "$FAIL_ON" ]; then
          CMD="$CMD --fail-on $FAIL_ON"
        fi

        FAIL_BELOW="${{ inputs.fail-if-score-below }}"
        if [ -n "$FAIL_BELOW" ]; then
          CMD="$CMD --fail-if-score-below $FAIL_BELOW"
        fi

        BASELINE="${{ inputs.baseline }}"
        if [ -n "$BASELINE" ] && [ -f "$BASELINE" ]; then
          CMD="$CMD --baseline $BASELINE"
          if [ "${{ inputs.fail-on-regression }}" = "true" ]; then
            CMD="$CMD --fail-on-regression"
          fi
        fi

        echo "cmd=$CMD" >> $GITHUB_OUTPUT
        echo "report_path=${{ runner.temp }}/securl-report.json" >> $GITHUB_OUTPUT
        echo "sarif_path=${{ runner.temp }}/securl-findings.sarif" >> $GITHUB_OUTPUT

    - name: Run SecURL scan
      id: scan
      shell: bash
      run: |
        set +e
        ${{ steps.build-cmd.outputs.cmd }}
        SCAN_EXIT=$?
        set -e

        REPORT="${{ steps.build-cmd.outputs.report_path }}"

        if [ ! -f "$REPORT" ]; then
          echo "::error::SecURL scan did not produce a report. Check that the target URL is publicly reachable."
          exit 1
        fi

        # Parse key metrics from ci-json output
        SCORE=$(node -e "
          const r = JSON.parse(require('fs').readFileSync('$REPORT','utf8'));
          const analyses = r.analyses ?? [r];
          const first = analyses[0];
          console.log(first?.analysis?.score ?? first?.score ?? 0);
        " 2>/dev/null || echo "0")

        GRADE=$(node -e "
          const r = JSON.parse(require('fs').readFileSync('$REPORT','utf8'));
          const analyses = r.analyses ?? [r];
          const first = analyses[0];
          console.log(first?.analysis?.grade ?? first?.grade ?? 'F');
        " 2>/dev/null || echo "F")

        CRITICAL=$(node -e "
          const r = JSON.parse(require('fs').readFileSync('$REPORT','utf8'));
          const analyses = r.analyses ?? [r];
          let count = 0;
          for (const a of analyses) {
            const issues = a?.analysis?.issues ?? a?.issues ?? [];
            count += issues.filter(i => i.severity === 'critical').length;
          }
          console.log(count);
        " 2>/dev/null || echo "0")

        WARNING=$(node -e "
          const r = JSON.parse(require('fs').readFileSync('$REPORT','utf8'));
          const analyses = r.analyses ?? [r];
          let count = 0;
          for (const a of analyses) {
            const issues = a?.analysis?.issues ?? a?.issues ?? [];
            count += issues.filter(i => i.severity === 'warning').length;
          }
          console.log(count);
        " 2>/dev/null || echo "0")

        PASSED="true"
        if [ "$SCAN_EXIT" -ne 0 ]; then
          PASSED="false"
        fi

        echo "score=$SCORE" >> $GITHUB_OUTPUT
        echo "grade=$GRADE" >> $GITHUB_OUTPUT
        echo "critical_count=$CRITICAL" >> $GITHUB_OUTPUT
        echo "warning_count=$WARNING" >> $GITHUB_OUTPUT
        echo "passed=$PASSED" >> $GITHUB_OUTPUT
        echo "report_path=$REPORT" >> $GITHUB_OUTPUT
        echo "sarif_path=${{ steps.build-cmd.outputs.sarif_path }}" >> $GITHUB_OUTPUT

        # Generate SARIF output for GitHub Code Scanning
        node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('$REPORT', 'utf8'));
          const analyses = r.analyses ?? [r];
          const rules = [];
          const results = [];
          const ruleIds = new Set();

          for (const entry of analyses) {
            const analysis = entry?.analysis ?? entry;
            const issues = analysis?.issues ?? [];
            const targetUri = (analysis?.url ?? '${{ inputs.url }}').replace(/^https?:\/\//, '');

            for (const issue of issues) {
              const ruleId = issue.id ?? issue.title?.replace(/\s+/g, '-').toLowerCase() ?? 'unknown';
              if (!ruleIds.has(ruleId)) {
                ruleIds.add(ruleId);
                const tags = [];
                if (issue.owasp) tags.push('owasp:' + issue.owasp);
                if (issue.mitre) tags.push('mitre:' + issue.mitre);
                rules.push({
                  id: ruleId,
                  name: issue.title ?? ruleId,
                  shortDescription: { text: issue.title ?? ruleId },
                  fullDescription: { text: issue.description ?? issue.title ?? ruleId },
                  helpUri: 'https://securl.online',
                  properties: { tags, 'security-severity': issue.severity === 'critical' ? '9.0' : issue.severity === 'warning' ? '5.0' : '2.0' }
                });
              }
              results.push({
                ruleId,
                message: { text: issue.recommendation ?? issue.description ?? issue.title ?? '' },
                locations: [{ physicalLocation: { artifactLocation: { uri: targetUri, uriBaseId: '%SRCROOT%' } } }],
                level: issue.severity === 'critical' ? 'error' : issue.severity === 'warning' ? 'warning' : 'note',
                properties: { score: analysis.score, grade: analysis.grade }
              });
            }
          }

          const sarif = {
            '\$schema': 'https://json.schemastore.org/sarif-2.1.0.json',
            version: '2.1.0',
            runs: [{
              tool: {
                driver: {
                  name: 'SecURL',
                  version: '1.4.0',
                  informationUri: 'https://securl.online',
                  rules
                }
              },
              results,
              automationDetails: { id: 'securl/external-posture-scan' }
            }]
          };

          fs.writeFileSync('${{ steps.build-cmd.outputs.sarif_path }}', JSON.stringify(sarif, null, 2));
          process.stderr.write('SARIF written: ' + results.length + ' findings\n');
        " 2>&1

        # Write step summary
        node -e "
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('$REPORT', 'utf8'));
          const analyses = r.analyses ?? [r];
          let md = '## SecURL Security Posture Scan\n\n';
          md += '| Target | Grade | Score | Critical | Warning |\n';
          md += '|--------|-------|-------|----------|---------|\n';
          for (const entry of analyses) {
            const a = entry?.analysis ?? entry;
            const url = a?.url ?? '';
            const grade = a?.grade ?? '?';
            const score = a?.score ?? '?';
            const issues = a?.issues ?? [];
            const critical = issues.filter(i => i.severity === 'critical').length;
            const warning = issues.filter(i => i.severity === 'warning').length;
            const gradeEmoji = grade === 'A' ? '🟢' : grade === 'B' ? '🟡' : grade === 'C' ? '🟠' : '🔴';
            md += \`| \${url} | \${gradeEmoji} \${grade} | \${score}/100 | \${critical} | \${warning} |\n\`;
          }
          md += '\n> Powered by [SecURL](https://securl.online) — passive external security posture analysis.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
        " 2>/dev/null || true

        # Propagate policy exit code
        if [ "$SCAN_EXIT" -ne 0 ]; then
          echo "::error::SecURL policy gate failed (exit $SCAN_EXIT). Review findings above."
          exit $SCAN_EXIT
        fi

    - name: Upload SARIF to GitHub Code Scanning
      if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_path }}
        category: securl-external-posture
      continue-on-error: true

    - name: Post PR comment
      if: ${{ inputs.post-pr-comment == 'true' && github.event_name == 'pull_request' && always() }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const reportPath = '${{ steps.scan.outputs.report_path }}';

          if (!fs.existsSync(reportPath)) return;

          const r = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const analyses = r.analyses ?? [r];
          const passed = '${{ steps.scan.outputs.passed }}' === 'true';
          const statusEmoji = passed ? '✅' : '❌';

          let body = `## ${statusEmoji} SecURL External Posture Scan\n\n`;
          body += `| Target | Grade | Score | Critical | Warning |\n`;
          body += `|--------|-------|-------|----------|---------|\n`;

          for (const entry of analyses) {
            const a = entry?.analysis ?? entry;
            const url = a?.url ?? '';
            const grade = a?.grade ?? '?';
            const score = a?.score ?? '?';
            const issues = a?.issues ?? [];
            const critical = issues.filter(i => i.severity === 'critical').length;
            const warning = issues.filter(i => i.severity === 'warning').length;
            const gradeEmoji = grade === 'A' ? '🟢' : grade === 'B' ? '🟡' : grade === 'C' ? '🟠' : '🔴';
            body += `| \`${url}\` | ${gradeEmoji} ${grade} | ${score}/100 | ${critical} | ${warning} |\n`;
          }

          if (!passed) {
            body += `\n> ⚠️ One or more policy gates failed. Review the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.\n`;
          }

          body += `\n<sub>Powered by [SecURL](https://securl.online) — passive external security posture analysis.</sub>`;

          // Find and update existing comment or create new one
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c => c.body.includes('SecURL External Posture Scan'));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }
